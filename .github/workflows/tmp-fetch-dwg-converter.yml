name: tmp-fetch-dwg-converter
on:
  push:
    branches: [tmp-dwg-convert-20260826]
permissions:
  contents: read
jobs:
  fetch-converter:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare standalone converter
        run: |
          mkdir -p bundle
          cd bundle
          npm pack dwg2dxf-converter@1.0.4
          tar -xzf dwg2dxf-converter-1.0.4.tgz
          rm dwg2dxf-converter-1.0.4.tgz
      - name: Upload converter bundle
        uses: actions/upload-artifact@v4
        with:
          name: dwg2dxf-converter-bundle
          path: bundle/package
          retention-days: 1
